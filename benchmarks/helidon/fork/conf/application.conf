# The fork's side of the head-to-head: the same endpoints as helidon-se and helidon-mp.
application.name=bench-fork
application.mode=dev
%prod.application.mode=prod
application.secret=${PLAY_SECRET}
java.source=25
http.address=127.0.0.1

# H2 in its native mode, in memory. The pool hands out connections with autocommit off, so jobs/Seed commits.
db.url=jdbc:h2:mem:bench;DB_CLOSE_DELAY=-1
db.driver=org.h2.Driver
db.user=sa
db.pass=
jpa.ddl=create
