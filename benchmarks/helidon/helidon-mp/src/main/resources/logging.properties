handlers=io.helidon.logging.jul.HelidonConsoleHandler
java.util.logging.SimpleFormatter.format=%1$tY.%1$tm.%1$td %1$tH:%1$tM:%1$tS %4$s %3$s !thread!: %5$s%6$s%n
.level=INFO
# Hibernate warns, at every session it opens, about each configuration value that is not serializable; Helidon MP
# hands it its whole configuration, environment variables included, so that is two warnings per JPA request.
org.hibernate.internal.SessionImpl.level=SEVERE
