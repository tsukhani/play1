quarkus.http.host=127.0.0.1
quarkus.http.port=8080

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:bench;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.max-size=30
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# The fork's five default security headers (its SecurityHeadersPolicy), with its values, on every response (PF-249)
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."X-XSS-Protection".value=0
quarkus.http.header."Content-Security-Policy".value=default-src 'self'

# The tls profile, which run.py's TLS cells start: the HTTPS listener alone, and the fork's HSTS on every response.
# run.py passes the port, the certificate and the engine. TLS 1.3 and 1.2, as the fork and Helidon offer: Quarkus
# offers 1.3 alone by default, which oha on macOS, through Security.framework, cannot speak.
%tls.quarkus.http.insecure-requests=disabled
%tls.quarkus.tls.protocols=TLSv1.3,TLSv1.2
%tls.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
