    - io.netty -> netty-codec-base 4.2.15.Final
    # netty-codec-compression carries the gzip/deflate/brotli/zstd encoder
    # classes that Netty 4.2 split out of netty-codec-http. HttpContentCompressor
    # static-references them via StandardCompressionOptions, so without this jar
    # the no-arg ctor blows up with NoClassDefFoundError: BrotliEncoder. Brings
    # com.aayushatharva.brotli4j + native classifiers transitively, which lets
    # HttpServerPipelineFactory wire brotli when it constructs the compressor.
    - io.netty -> netty-codec-compression 4.2.15.Final
    - io.netty -> netty-codec-http 4.2.15.Final
    # PF-58: HTTP/2 codec + multiplex handler. Always active when HTTPS is configured;
    # SslHttpServerPipelineFactory installs Http2FrameCodec + Http2MultiplexHandler in the
    # ALPN h2 branch (h1.1 fallback handled by Http2OrHttp1Negotiator). Same Netty version
    # as the other codec-* artifacts.
    - io.netty -> netty-codec-http2 4.2.15.Final
    - io.netty -> netty-common 4.2.15.Final
    - io.netty -> netty-handler 4.2.15.Final
    - io.netty -> netty-resolver 4.2.15.Final
    - io.netty -> netty-transport 4.2.15.Final
    # PF-58: Netty 4.2 SslHandler.handlerAdded -> setOpensslEngineSocketFd loads
    # io.netty.channel.unix.UnixChannel unconditionally (not guarded behind an
    # OpenSSL-only branch). Without this artifact every HTTPS connection fails
    # at pipeline init with NoClassDefFoundError. The fork's HTTPS path was
    # latently broken since the Netty 4.2 migration (PF-31); surfaced when PF-58
    # added the first integration test that opens a real TLS socket.
    - io.netty -> netty-transport-native-unix-common 4.2.15.Final
    # PF-57: HTTP/3 over QUIC. Activated automatically when https.port is set
    # (subject to native QUIC availability — see Http3SslContextFactory).
    # netty-codec-http3 ships the Http3* frame codec + Http3ServerConnectionHandler;
    # netty-codec-classes-quic ships the QUIC transport classes (QuicSslContextBuilder,
    # QuicServerCodecBuilder, QuicChannel, QuicStreamChannel). The native-quic artifact
    # ships per-platform Quiche static library compiled to JNI — Quic.ensureAvailability()
    # gates QuicServer.start() at boot so unsupported platforms (e.g. linux-riscv64,
    # which has no upstream native) get an actionable IllegalStateException instead of
    # a silent UDP bind failure.
    - io.netty -> netty-codec-http3 4.2.15.Final
    - io.netty -> netty-codec-classes-quic 4.2.15.Final
    - io.netty -> netty-codec-native-quic 4.2.15.Final osx-aarch_64
    - io.netty -> netty-codec-native-quic 4.2.15.Final osx-x86_64
    - io.netty -> netty-codec-native-quic 4.2.15.Final linux-aarch_64
    - io.netty -> netty-codec-native-quic 4.2.15.Final linux-x86_64
    - io.netty -> netty-codec-native-quic 4.2.15.Final windows-x86_64
    # PF-105: BoringSSL-backed Netty TLS provider. OpenSslContext beats the JDK
    # SSLEngine on handshake throughput (2-3x) and bulk symmetric crypto (AES-NI
    # via the native lib, not via JDK intrinsics). SslHttpServerPipelineFactory
    # selects SslProvider.OPENSSL_REFCNT when OpenSsl.isAvailable() reports true
    # and falls back to the JDK provider with a warn log otherwise.
    # netty-tcnative-classes carries the io.netty.internal.tcnative.* Java API
    # (SSL, SSLContext, Buffer, CertificateVerifier...) that OpenSsl loads at
    # static-init time; without it Netty's OpenSsl probe throws CNFE before
    # isAvailable() can return false. Same per-classifier pattern as
    # netty-codec-native-quic above — boringssl-static ships its native libs
    # per platform. Shipping all five classifiers keeps the framework portable
    # across the platforms users run Play on (macOS arm64/x86_64, Linux
    # arm64/x86_64, Windows x86_64). tcnative selects the matching native at
    # runtime; unused ones are dead weight but don't load.
    - io.netty -> netty-tcnative-classes 2.0.79.Final
    - io.netty -> netty-tcnative-boringssl-static 2.0.79.Final osx-aarch_64
    - io.netty -> netty-tcnative-boringssl-static 2.0.79.Final osx-x86_64
    - io.netty -> netty-tcnative-boringssl-static 2.0.79.Final linux-aarch_64
    - io.netty -> netty-tcnative-boringssl-static 2.0.79.Final linux-x86_64
    - io.netty -> netty-tcnative-boringssl-static 2.0.79.Final windows-x86_64
    # com.aayushatharva.brotli4j is the JNI wrapper around the Brotli C lib that
    # StandardCompressionOptions.brotli() loads. brotli4j publishes per-platform
    # natives as separate artifactIds (NOT Ivy classifiers); the `service` jar is
    # the SPI loader peer that brotli4j uses at runtime to discover the matching
    # native. Under transitiveDependencies: false everything must be declared
    # explicitly. Shipping all six natives (~4.5 MB total in lib/) keeps the
    # framework portable across the platforms users actually run Play on:
    # macOS arm64/x86_64, Linux x86_64/arm64/riscv64, Windows x86_64. The native
    # service-loader picks the right one at runtime; unused ones are dead weight
    # but don't load.
    - com.aayushatharva.brotli4j -> brotli4j 1.23.0
    - com.aayushatharva.brotli4j -> service 1.23.0
    - com.aayushatharva.brotli4j -> native-osx-aarch64 1.23.0
    - com.aayushatharva.brotli4j -> native-osx-x86_64 1.23.0
    - com.aayushatharva.brotli4j -> native-linux-aarch64 1.23.0
    - com.aayushatharva.brotli4j -> native-linux-x86_64 1.23.0
    - com.aayushatharva.brotli4j -> native-linux-riscv64 1.23.0
    - com.aayushatharva.brotli4j -> native-windows-x86_64 1.23.0
    - org.postgresql -> postgresql 42.7.11
    - org.slf4j -> slf4j-api 2.0.18
    - org.apache.logging.log4j -> log4j-slf4j2-impl 2.26.1
    - org.yaml -> snakeyaml 2.6
    # PF-26: Jackson XML replaces XStream for renderXml(Object). Jackson 2.12+
    # requires a non-default Stax provider, so woodstox-core + stax2-api are
    # mandatory companions, not optional. jackson-annotations versions are
    # pinned at 2.22 by the Jackson 2.22.x BOM (annotations is stable across
    # point releases).
    - com.fasterxml.jackson.core -> jackson-annotations 2.22
    - com.fasterxml.jackson.core -> jackson-core 2.22.0
    - com.fasterxml.jackson.core -> jackson-databind 2.22.0
    - com.fasterxml.jackson.dataformat -> jackson-dataformat-xml 2.22.0
    - com.fasterxml.jackson.dataformat -> jackson-dataformat-yaml 2.22.0
    - com.fasterxml.jackson.datatype -> jackson-datatype-jsr310 2.22.0
    - com.fasterxml.woodstox -> woodstox-core 7.2.1
    - org.codehaus.woodstox -> stax2-api 4.3.0
    # PF-12: OpenAPI 3 spec generation. swagger-models supplies the OpenAPI
    # object graph; swagger-core supplies Json/Yaml pretty-printers that wrap
    # Jackson with consistent ordering; swagger-annotations is a compile-time
    # peer of swagger-models. Annotation-driven enrichment of controllers is
    # deliberately out of scope for the initial cut — swagger-jaxrs2 et al.
    # would pull JAX-RS, which Play does not use. jackson-dataformat-yaml +
    # jackson-datatype-jsr310 are runtime peers of swagger-core's Yaml.mapper()
    # and ObjectMapper customizations.
    - io.swagger.core.v3 -> swagger-models 2.2.52
    - io.swagger.core.v3 -> swagger-core 2.2.52
    - io.swagger.core.v3 -> swagger-annotations 2.2.52
    # PF-13: Micrometer + Prometheus exposition. micrometer-core ships the meter
    # registry + bundled JVM binders; micrometer-registry-prometheus carries
    # the PrometheusMeterRegistry that scrapes to OpenMetrics text. From
    # Micrometer 1.13.x onward the Prometheus registry uses the new
    # io.prometheus:prometheus-metrics-* (client_java v1) family, NOT the
    # legacy io.prometheus:simpleclient line. HdrHistogram + LatencyUtils are
    # micrometer-core runtime transitives — declared explicitly because
    # transitiveDependencies is off.
    - io.micrometer -> micrometer-core 1.17.0
    - io.micrometer -> micrometer-commons 1.17.0
    - io.micrometer -> micrometer-observation 1.17.0
    - io.micrometer -> micrometer-registry-prometheus 1.17.0
    - io.micrometer -> micrometer-registry-otlp 1.17.0
    # micrometer-registry-otlp transitives: opentelemetry-proto serializes the
    # push payload, protobuf-java is its peer. The Prometheus side ships its
    # own shaded protobuf so the unshaded one declared here is OTLP-only.
    - io.opentelemetry.proto -> opentelemetry-proto 1.10.0-alpha
    # PF-130: protobuf-java is the unshaded protobuf used only by the OTLP exporter
    # (the Prometheus side ships its own shaded protobuf). Kept on a release that
    # fixes CVE-2024-7254 (unbounded-recursion parsing DoS; patched in 3.25.5+ AND
    # 4.27.5+). On the 4.x line to match micrometer 1.17's otlp registry:
    # opentelemetry-proto 1.10.0-alpha's gencode targets protobuf-java 4.34.0, and
    # the 4.35.x runtime is compatible with that gencode (runtime >= gencode, same
    # major). transitiveDependencies is off, so this explicit pin governs.
    - com.google.protobuf -> protobuf-java 4.35.1
    - io.prometheus -> prometheus-metrics-core 1.7.0
    - io.prometheus -> prometheus-metrics-model 1.7.0
    - io.prometheus -> prometheus-metrics-config 1.7.0
    - io.prometheus -> prometheus-metrics-tracer-common 1.7.0
    - io.prometheus -> prometheus-metrics-tracer-initializer 1.7.0
    - io.prometheus -> prometheus-metrics-exposition-formats 1.7.0
    # prometheus-metrics 1.3.x shades protobuf into exposition-formats itself, so the
    # standalone prometheus-metrics-shaded-protobuf artifact is gone; exposition-formats
    # now pulls the split-out exposition-textformats (text/OpenMetrics writer).
    - io.prometheus -> prometheus-metrics-exposition-textformats 1.7.0
    - org.hdrhistogram -> HdrHistogram 2.2.2
    - org.latencyutils -> LatencyUtils 2.0.3
    # PF-104: OkHttp 5 replaces java.net.http.HttpClient as the WSAsync transport.
    # Square publishes 5.x with the KMP layout — `okhttp:5.x` is a 767-byte alias
    # POM that redirects (via Gradle metadata) to the real jar at
    # `okhttp-jvm:5.x`. Ivy reads POMs, not Gradle metadata, so we declare both
    # coordinates explicitly: `okhttp` for the canonical name, `okhttp-jvm` for
    # the bytecode. Same shape for okio:3.x (real classes live in `okio-jvm`).
    # okhttp-sse ships a single jar without the -jvm split. kotlin-stdlib is a
    # mandatory runtime peer (OkHttp 5 is implemented in Kotlin) — Ivy can't
    # discover it transitively under transitiveDependencies: false.
    - com.squareup.okhttp3 -> okhttp 5.4.0
    - com.squareup.okhttp3 -> okhttp-jvm 5.4.0
    - com.squareup.okhttp3 -> okhttp-sse 5.4.0
    - com.squareup.okio -> okio 3.17.0
    - com.squareup.okio -> okio-jvm 3.17.0
    - org.jetbrains.kotlin -> kotlin-stdlib 2.4.0

# Default repositories, used for all projects
repositories:

    - playCore:
        type:       local
        descriptor: "${play.path}/framework/dependencies.yml"
        artifact:   "${play.path}/framework/play-[revision].jar"
        contains:
            - play -> play

    - playCoreDependencies:
        # PF-83: chain wraps the local-jar lookup with a Maven Central fallback so
        # newly declared deps in the require: list above resolve from Central on
        # first run instead of failing with "module not found". Ivy's
        # addModuleConfiguration pins each contains: entry to a single resolver
        # name; making that resolver a ChainResolver (returnFirst=true) preserves
        # the cached-jar fast path while letting absent jars fall through to
        # Central. SettingsParser.parseRepository chain branch sets returnFirst
        # automatically.
        type:       chain
        using:
            - playCoreDependenciesLocal:
                type:       local
                # PF-57: the (-[classifier]) optional segment is Ivy syntax for "include only if
                # the classifier extra-attribute is set". Lets entries declare native artifacts
                # via "io.netty -> netty-codec-native-quic 4.2.15.Final osx-aarch_64" and the
                # resolver looks up the classifier-suffixed jar on disk; classifier-less entries
                # like "io.netty -> netty-codec-http 4.2.15.Final" continue to resolve to plain
                # name-revision.jar. YamlParser already populates the classifier extra-attribute
                # via the regex at YamlParser.java:173-181.
                artifact:   "${play.path}/framework/lib/[artifact]-[revision](-[classifier]).jar"
            - playCoreDependenciesCentral:
                type:       iBiblio
                m2compatible: true
        contains:   *allDependencies
        
    - playCoreDocviewer:
        type:       local
        artifact:   "${play.path}/modules/docviewer"
        contains:
            - play -> docviewer $version

    - playModules:  
        type:       chain
        using:            
            - playLocalModules:
                type:       local
                descriptor: "${play.path}/modules/[module]-[revision]/conf/dependencies.yml"
                artifact:   "${play.path}/modules/[module]-[revision]"

            - playContributedModules:
                type:       http
                descriptor: "https://www.playframework.com/modules/repo/[module]/[revision]/dependencies.yml"
                artifact:   "https://www.playframework.com/modules/[module]-[revision].zip"
                
        contains:
            - play -> *

    - mavenCentral:
        type:           iBiblio

