    - org.jboss.logging -> jboss-logging 3.6.3.Final
    - jakarta.transaction -> jakarta.transaction-api 2.0.1
    - jakarta.xml.bind -> jakarta.xml.bind-api 4.0.5
    # jaxb-runtime 4.0.x (jakarta namespace) replaces the old 2.3.9 (javax),
    # matching jakarta.xml.bind-api 4.0.5 + Hibernate 7's JAXB usage. Under
    # transitiveDependencies: false its runtime tree is declared explicitly
    # (companion versions per jaxb-bom 4.0.9).
    - org.glassfish.jaxb -> jaxb-runtime 4.0.9
    - org.glassfish.jaxb -> jaxb-core 4.0.9
    - org.glassfish.jaxb -> txw2 4.0.9
    - com.sun.istack -> istack-commons-runtime 4.1.2
