# framework/lib audit allowlist — read by `ant audit-deps` (play.deps.DependencyAudit).
#
# Every jar in framework/lib is vendored, committed, and listed by hand in
# dependencies.yml (transitiveDependencies is off, so nothing arrives by accident).
# `ant audit-deps` asks jdeps which of them the framework's own bytecode can actually
# reach, and fails on any jar that is unreachable AND unlisted here.
#
# An unreachable jar is not a defect. Of 136 jars, 40 are unreachable and nearly all
# are genuinely required — static analysis simply cannot see four things:
#
#   jni         a native library the OS loads; no bytecode ever names it
#   spi         a ServiceLoader binding, or a class named in a log4j/config file
#   reflective  loaded by name at runtime, e.g. from a configuration string
#   module      used only by a bundled module's app/ tree, which ApplicationClassloader
#               compiles at RUNTIME and which therefore exists in no jar to analyse
#   app         shipped for end-user applications to compile against; the framework
#               itself legitimately never loads it
#   kmp-alias   a Kotlin-multiplatform alias artifact carrying no classes at all
#   tooling     used by the build, not by the framework at runtime
#   unverified  nobody has actually confirmed why this is here — real remaining work,
#               kept visible rather than papered over with an invented reason
#
# So the check is not "is it used" but "has someone said why". This file is that
# justification. It exists because org.eclipse.jdt.core sat in lib/ from 2011, became
# redundant in 2023 when ecj was listed beside it, and was still being re-vendored on
# every JDT bump two years later — because nothing recorded what it was for, there was
# nothing to contradict.
#
# Format:  <glob>  <category>  <reason>
# Globs match the jar filename and should tolerate version bumps. First match wins, so
# put specific patterns above general ones. A pattern matching no jar fails the build —
# that is how the list is kept from rotting when a dependency is dropped.

# --- JNI natives: loaded by the OS, never referenced from bytecode -----------------
native-*-1.*.jar                              jni  brotli4j per-platform natives; brotli4j loads the one matching the host at runtime.
netty-codec-native-quic-*.jar                 jni  Netty HTTP/3 QUIC natives, one per platform classifier; selected at runtime.
netty-tcnative-boringssl-static-*.jar         jni  BoringSSL natives behind netty-tcnative-classes; selected at runtime.

# --- Named in a config string, never imported -------------------------------------
postgresql-*.jar                              reflective  Loaded by name via db.driver; DBPlugin.java sets "org.postgresql.Driver" as a string literal, so no import exists.

# --- Log4j bindings, resolved by SPI / configuration ------------------------------
log4j-slf4j2-impl-*.jar                       spi  slf4j-to-log4j2 binding, found via ServiceLoader; nothing imports it.
log4j-layout-template-json-*.jar              spi  Supplies JsonTemplateLayout, named only in conf/log4j-json.properties for application.log.format=json.

# --- Bundled modules' app/ trees, compiled at runtime and present in no jar --------
asm-{analysis,commons,tree,util}-*.jar        module  modules/testrunner/app/controllers/TestRunner.java imports org.objectweb.asm.*; a module's app/ is compiled by ApplicationClassloader at runtime, so this reference exists in no analysable artifact.

# --- Shipped for end-user applications, not for the framework itself --------------
junit-jupiter-engine-*.jar                    app  Test engine for applications' own tests; discovered by ServiceLoader, never imported.
junit-jupiter-params-*.jar                    app  @ParameterizedTest support for applications' tests.
hamcrest-*.jar                                app  Matcher library available to applications' tests.
okhttp-sse-*.jar                              app  OkHttp SSE client shipped for applications consuming event streams (PF-104).

# --- Kotlin-multiplatform alias artifacts: zero classes, kept for the canonical name
# See the PF-104 note in dependencies.yml: Ivy reads POMs, not Gradle metadata, so both
# the alias coordinate and the -jvm coordinate carrying the bytecode are declared.
okhttp-5.*.jar                                kmp-alias  Alias artifact for okhttp-jvm; contains only META-INF metadata.
okio-3.*.jar                                  kmp-alias  Alias artifact for okio-jvm; contains only KMP commonMain linkdata.

# --- Runtime peers of Hibernate / JAXB / Jackson-XML, loaded reflectively ---------
jaxb-runtime-*.jar                            reflective  JAXB 4 runtime behind jakarta.xml.bind-api; implementation resolved at runtime.
jaxb-core-*.jar                               reflective  jaxb-runtime companion (jaxb-bom 4.0.9 set).
txw2-*.jar                                    reflective  jaxb-runtime companion (jaxb-bom 4.0.9 set).
istack-commons-runtime-*.jar                  reflective  jaxb-runtime companion (jaxb-bom 4.0.9 set).
angus-activation-*.jar                        reflective  jakarta.activation implementation, resolved at runtime.
woodstox-core-*.jar                           reflective  Stax provider required by Jackson XML (PF-26); selected via the Stax factory, not imported.
micrometer-observation-*.jar                  reflective  micrometer-core runtime peer; declared explicitly because transitiveDependencies is off.
prometheus-metrics-exposition-formats-*.jar   reflective  Prometheus exposition writer selected at scrape time by the metrics registry.

# --- Removed after audit ----------------------------------------------------------
# dom4j, jandex and cglib were dropped from dependencies.yml once both audit passes
# agreed: unreachable from every root, referenced by no other jar, and never loaded in
# an `ant audit-census` run where Hibernate fully bootstrapped against H2 (3,892
# hibernate-core classes, 5,035 org.hibernate.* loads, DDL and entity operations, with
# ByteBuddy doing the enhancement cglib once did). Hibernate 6 dropped dom4j and made
# Jandex optional; Hibernate 5 replaced cglib with ByteBuddy. An application that wants
# any of them should declare it in its own build.gradle.kts.
